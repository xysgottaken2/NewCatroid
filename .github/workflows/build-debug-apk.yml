name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Version of the dated release, e.g. 2.3.0 (empty = only the rolling debug release)'
        required: false
        type: string
        default: ''
      release_notes:
        description: 'Short description for that release (optional)'
        required: false
        type: string
        default: ''
      report_failures:
        description: 'Post build/test failure details as a comment on the run commit (optional)'
        required: false
        type: boolean
        default: false
      run_full_suite:
        description: 'Run the optional full unit test suite after APK upload (diagnostic only)'
        required: false
        type: boolean
        default: false
  push:

permissions:
  contents: write

env:
  _JAVA_OPTIONS: "-Xmx5g"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.workers.max=4 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  localweb-tests:
    name: Unit tests (local web and streamed downloads)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYGTA5_WORKER_SOURCE: /tmp/newcatroid-playgta5-wgpu-worker.js
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle (caches dependencies)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare project (CI applicationId, Firebase config, midi packages)
        run: |
          sed -i 's/applicationId "org.DanVexTeam.NewCatroid"/applicationId "org.DanVexTeam.NewCatroid.ci"/g' catroid/build.gradle
          find . -name "google-services*.json" -exec sed -i 's/"org.DanVexTeam.NewCatroid"/"org.DanVexTeam.NewCatroid.ci"/g' {} +
          find catroid/src -type f -name "*.java" -exec sed -i 's/com.pdrogfer.mididroid/com.leff.midi/g' {} +
          find catroid/src -type f -name "*.java" -exec sed -i 's/com.oliewa92.mididroid/com.leff.midi/g' {} +
          echo "Project prepared for CI"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Fetch pinned public renderer for integration test (no game assets)
        run: curl --fail --location --retry 3 --proto '=https' 'https://raw.githubusercontent.com/shadany7824/playgta5/2fb671adca55cd0317aa551b33ffd922f1639660/wgpu_worker.js' --output "$PLAYGTA5_WORKER_SOURCE"

      - name: Run local web block tests
        run: |
          set -o pipefail
          ./gradlew :catroid:testDanvexDebugUnitTest \
            --tests "org.catrobat.catroid.test.localweb.*" \
            --tests "org.catrobat.catroid.test.common.NewCatroidDownloadTest" \
            --tests "org.catrobat.catroid.test.common.DownloadFileActionLifecycleTest" \
            --tests "org.catrobat.catroid.test.xmlformat.*" \
            --build-cache --parallel --stacktrace 2>&1 | tee "${RUNNER_TEMP}/test-output.log"

      - name: Run browser diagnostics and touch-control JS tests
        run: node --test catroid/src/test/js/*.test.cjs

      - name: Extract test failure details
        if: failure()
        run: |
          OUT="${RUNNER_TEMP}/failures.txt"
          : > "$OUT"
          for f in catroid/build/test-results/testDanvexDebugUnitTest/*.xml; do
            [ -e "$f" ] || continue
            python3 - "$f" >> "$OUT" <<'PY'
          import sys, xml.etree.ElementTree as ET
          try:
              tree = ET.parse(sys.argv[1])
          except Exception:
              sys.exit(0)
          for tc in tree.getroot().iter('testcase'):
              for fail in list(tc.iter('failure')) + list(tc.iter('error')):
                  print("FAILED: %s.%s" % (tc.get('classname'), tc.get('name')))
                  print("  message: %s" % (fail.get('message') or '')[:400])
                  text = (fail.text or '').strip()
                  print("  stack: %s" % text[:1500])
                  print()
          PY
          done
          echo "extracted $(wc -l < "$OUT") lines of failure details"

      - name: Report failure details as a commit comment (optional)
        # Reports on workflow_dispatch runs with report_failures=true and on
        # every failed push run of the local-web feature branch.
        if: failure() && (github.event.inputs.report_failures == 'true' || github.ref == 'refs/heads/arena/5736be66-newcatroid')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE="${RUNNER_TEMP}/failure.md"
          {
            echo "## :x: Build/test failure - run ${{ github.run_number }} @ ${{ github.sha }}"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ -f "${RUNNER_TEMP}/failures.txt" ]; then
              echo "### Failed test cases"
              echo '```'
              head -n 200 "${RUNNER_TEMP}/failures.txt"
              echo '```'
            fi
            if [ -f "${RUNNER_TEMP}/test-output.log" ]; then
              echo "### Unit test output (errors first, then tail)"
              echo '```'
              grep -E "^e: |error:|FAILED|Execution failed|What went wrong|tests? (completed|failed)|There were failing tests" "${RUNNER_TEMP}/test-output.log" | head -n 100
              echo "----- tail -----"
              tail -n 60 "${RUNNER_TEMP}/test-output.log"
              echo '```'
            fi
          } > "$BODY_FILE"
          python3 - "$BODY_FILE" <<'PY'
          import json, os, sys, urllib.request
          body = open(sys.argv[1]).read()
          req = urllib.request.Request(
              "https://api.github.com/repos/%s/commits/%s/comments" % (os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"]),
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": "token " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json"},
              method="POST")
          with urllib.request.urlopen(req) as resp:
              print("Posted failure details as a commit comment (HTTP %s)" % resp.status)
          PY

      - name: Upload test reports, results and logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NewCatroid-test-reports-run${{ github.run_number }}-${{ github.sha }}
          path: |
            catroid/build/test-results/testDanvexDebugUnitTest/*.xml
            catroid/build/reports/tests/testDanvexDebugUnitTest/**
            ${{ runner.temp }}/test-output.log
          retention-days: 30
          if-no-files-found: warn

  shader-validation:
    name: Real WGSL compiler regression (Dawn null backend, no rendering)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Dawn validator
        run: npm ci --prefix tools/playgta5-validation --no-audit --no-fund
      - name: Reproduce original failure and validate corrected shader variants
        run: |
          set -o pipefail
          curl --fail --location --retry 3 --proto '=https' 'https://raw.githubusercontent.com/shadany7824/playgta5/2fb671adca55cd0317aa551b33ffd922f1639660/wgpu_worker.js' --output "${RUNNER_TEMP}/wgpu_worker.js"
          node tools/playgta5-validation/validate.mjs "${RUNNER_TEMP}/wgpu_worker.js" 2>&1 | tee "${RUNNER_TEMP}/shader-validation.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlayGTA5-shader-validation-${{ github.sha }}
          path: ${{ runner.temp }}/shader-validation.log
          if-no-files-found: error
          retention-days: 30

  # Run in parallel with focused tests so their results stay visible without delaying the APK artifact.
  build-apk:
    name: Debug APK (danvex)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Needed to publish the APK as a release asset (see the last step): workflow
    # artifacts and their download links are tied to a run and expire, a release
    # asset keeps a permanent URL.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle (caches dependencies)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Prepare project (CI applicationId, Firebase config, midi packages)
        run: |
          sed -i 's/applicationId "org.DanVexTeam.NewCatroid"/applicationId "org.DanVexTeam.NewCatroid.ci"/g' catroid/build.gradle
          find . -name "google-services*.json" -exec sed -i 's/"org.DanVexTeam.NewCatroid"/"org.DanVexTeam.NewCatroid.ci"/g' {} +
          find catroid/src -type f -name "*.java" -exec sed -i 's/com.pdrogfer.mididroid/com.leff.midi/g' {} +
          find catroid/src -type f -name "*.java" -exec sed -i 's/com.oliewa92.mididroid/com.leff.midi/g' {} +
          echo "Project prepared for CI"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test APK verifier
        run: python3 -m unittest discover -s tools -p 'test_verify_debug_apk.py' -v

      - name: Bump versionCode for this build
        # Every published APK has to be installable *over* the previous one, and
        # Android refuses an update whose versionCode is not higher. The committed
        # value therefore only has to grow once in a while; each release build
        # overwrites it with `committed + run_number`, so no release of this
        # repository can ever collide with another. Nothing is committed back:
        # the bump lives in this workspace only.
        run: |
          set -euo pipefail
          CURRENT="$(sed -n 's/^def defaultVersionCode = \([0-9][0-9]*\)$/\1/p' catroid/build.gradle)"
          if [ -z "$CURRENT" ]; then
            echo "Could not read defaultVersionCode from catroid/build.gradle" >&2
            exit 1
          fi
          NEW=$((CURRENT + GITHUB_RUN_NUMBER))
          sed -i "s/^def defaultVersionCode = ${CURRENT}$/def defaultVersionCode = ${NEW}/" catroid/build.gradle
          echo "versionCode ${CURRENT} -> ${NEW} (run ${GITHUB_RUN_NUMBER})"
          grep -n '^def defaultVersionName' catroid/build.gradle

      - name: Build debug APK (danvex)
        run: |
          set -o pipefail
          ./gradlew assembleDanvexDebug --build-cache --parallel -x lint -x test --stacktrace 2>&1 | tee "${RUNNER_TEMP}/build-output.log"

      - name: Verify APK launcher, compiled UI, assets, and ARM64 libraries
        run: |
          set -euo pipefail
          APK_PATH="$(find catroid/build/outputs/apk/danvex/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No danvexDebug APK was produced" >&2
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set" >&2
            exit 1
          fi
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          if [ -z "$AAPT" ] || [ ! -x "$AAPT" ]; then
            echo "Could not find executable aapt in $SDK_ROOT/build-tools" >&2
            exit 1
          fi
          python3 tools/verify_debug_apk.py --apk "$APK_PATH" --aapt "$AAPT" | tee "${RUNNER_TEMP}/apk-verification.txt"
          cat "${RUNNER_TEMP}/apk-verification.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NewCatroid-debug-apk-run${{ github.run_number }}-${{ github.sha }}
          path: 'catroid/build/outputs/apk/danvex/debug/*.apk'
          retention-days: 30

      - name: Publish the APK to the NewCatroid-debug-apk release
        # Gives a stable download link that does not expire with the run:
        # https://github.com/<repo>/releases/tag/NewCatroid-debug-apk
        # The asset is always NewCatroid_debug_latest.apk, so the "latest" URL
        # (…/releases/latest/download/NewCatroid_debug_latest.apk) never changes.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: NewCatroid-debug-apk
        run: |
          set -euo pipefail
          APK_PATH="$(find catroid/build/outputs/apk/danvex/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No danvexDebug APK to publish" >&2
            exit 1
          fi
          cp "$APK_PATH" /tmp/NewCatroid_debug_latest.apk
          SIZE="$(du -h /tmp/NewCatroid_debug_latest.apk | cut -f1)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          BRANCH="${GITHUB_REF_NAME}"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "NewCatroid debug APK (latest CI build)" \
              --notes "Rolling debug APK of the newest green CI build of \`$BRANCH\`.

          This release always carries exactly one asset, \`NewCatroid_debug_latest.apk\`, replaced on
          every successful build, plus a \`.sha256\` file. Workflow artifacts expire after 30 days;
          this link does not.

          * commit: \`$GITHUB_SHA\`
          * built by: run [$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          fi
          ( cd /tmp && sha256sum NewCatroid_debug_latest.apk > NewCatroid_debug_latest.apk.sha256 )
          gh release upload "$RELEASE_TAG" /tmp/NewCatroid_debug_latest.apk /tmp/NewCatroid_debug_latest.apk.sha256 --clobber
          gh release edit "$RELEASE_TAG" --notes "Rolling debug APK of the newest green CI build of \`$BRANCH\`.

          Download: \`NewCatroid_debug_latest.apk\` ($SIZE), replaced on every successful build.
          A \`.sha256\` file sits next to it. Workflow artifacts expire after 30 days; this link does not.

          * commit: \`$GITHUB_SHA\` ($SHORT_SHA)
          * built by: run [$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          * direct link: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/NewCatroid_debug_latest.apk"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'

      - name: Publish a dated release with a phone-friendly download link
        # Why: workflow artifacts need a GitHub login and are delivered as a
        # `.zip`, which Android cannot install directly. A release asset is a
        # plain `.apk` that can be tapped in the browser.
        # Runs when the workflow was dispatched with a version, or when the
        # commit message carries `[release]`.
        if: >-
          success() && (github.event.inputs.release_name != '' ||
          contains(github.event.head_commit.message, '[release]'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK_PATH="$(find catroid/build/outputs/apk/danvex/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No danvexDebug APK to publish" >&2
            exit 1
          fi

          VERSION="${{ github.event.inputs.release_name }}"
          VERSION="${VERSION#v}"
          NAME_WAS_GIVEN=1
          if [ -z "$VERSION" ]; then
            NAME_WAS_GIVEN=0
            VERSION="$(sed -n 's/^def defaultVersionName = "\{0,1\}\([0-9][^"]*\)"\{0,1\}$/\1/p' catroid/build.gradle)"
            VERSION="${VERSION}-build${GITHUB_RUN_NUMBER}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9A-Za-z._-]+$'; then
            echo "Invalid release name: $VERSION" >&2
            exit 1
          fi

          VERSION_CODE="$(sed -n 's/^def defaultVersionCode = \([0-9][0-9]*\)$/\1/p' catroid/build.gradle)"
          VERSION_NAME="$(sed -n 's/^def defaultVersionName = "\{0,1\}\([0-9][^"]*\)"\{0,1\}$/\1/p' catroid/build.gradle)"
          TAG="v$VERSION"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          FILE_NAME="NewCatroid_${VERSION}_arm64.apk"
          cp "$APK_PATH" "/tmp/$FILE_NAME"
          ( cd /tmp && sha256sum "$FILE_NAME" > "$FILE_NAME.sha256" )
          SIZE="$(du -h "/tmp/$FILE_NAME" | cut -f1)"
          EXTRA_NOTES="${{ github.event.inputs.release_notes }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading the asset to it"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "NewCatroid $VERSION" \
              --notes "NewCatroid $VERSION"
          fi
          gh release upload "$TAG" "/tmp/$FILE_NAME" "/tmp/$FILE_NAME.sha256" --clobber
          gh release edit "$TAG" --latest --title "NewCatroid $VERSION" --notes "${EXTRA_NOTES:+$EXTRA_NOTES

          }## Как установить / How to install

          1. Tap the APK (direct link, no GitHub login needed):
             $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$FILE_NAME
          2. Allow "install unknown apps" for the browser when Android asks.
          3. The package is org.DanVexTeam.NewCatroid.ci - it installs next to the
             Play-style build, so no existing project is touched.

          ## Что внутри / What is in it

          * fixes the exported-APK startup: the terms dialog of an exported app was empty, so
            its bundled project was never unpacked and the app closed right after the splash;
          * exports are now checked against the template (every brick and script must exist in
            it) and the finished APK is verified before it is offered;
          * APK templates of this repository are complete again (713 classes verified);
          * the splash screen of an exported APK shows the running startup stage, and a failure
            is shown in a dialog with details/copy instead of a silent close;
          * every export writes an export token, so a new build always unpacks its own project.

          ## Технические данные / Technical details

          * versionName $VERSION_NAME, versionCode $VERSION_CODE
          * size $SIZE, sha256 in $FILE_NAME.sha256
          * commit $SHORT_SHA, built by run [$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          * the APK template for the in-app *Build APK* dialog is attached to the NewCatroid-Template release"

          gh release view "$TAG" --json tagName,url,assets --jq '"released \(.tagName): \(.url)", (.assets[] | "  \(.name) \(.size) bytes")'
          if [ "$NAME_WAS_GIVEN" = "1" ]; then
            {
              echo "### Release published"
              echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$FILE_NAME"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report failure details as a commit comment (optional)
        if: failure() && (github.event.inputs.report_failures == 'true' || github.ref == 'refs/heads/arena/5736be66-newcatroid')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE="${RUNNER_TEMP}/failure.md"
          {
            echo "## :x: APK build failure - run ${{ github.run_number }} @ ${{ github.sha }}"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ -f "${RUNNER_TEMP}/build-output.log" ]; then
              echo "### APK build output (errors first, then tail)"
              echo '```'
              grep -E "^e: |error:|FAILED|Execution failed|What went wrong" "${RUNNER_TEMP}/build-output.log" | head -n 100
              echo "----- tail -----"
              tail -n 60 "${RUNNER_TEMP}/build-output.log"
              echo '```'
            fi
          } > "$BODY_FILE"
          python3 - "$BODY_FILE" <<'PY'
          import json, os, sys, urllib.request
          body = open(sys.argv[1]).read()
          req = urllib.request.Request(
              "https://api.github.com/repos/%s/commits/%s/comments" % (os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"]),
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": "token " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json"},
              method="POST")
          with urllib.request.urlopen(req) as resp:
              print("Posted failure details as a commit comment (HTTP %s)" % resp.status)
          PY

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NewCatroid-build-logs-run${{ github.run_number }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build-output.log
          retention-days: 30
          if-no-files-found: warn

  # Optional manual diagnostic. Wait until the APK and focused tests finish so this job cannot delay the artifact.
  full-unit-tests:
    name: Full unit test suite (manual diagnostic, does not block the APK)
    needs: [build-apk, localweb-tests]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_suite == 'true' }}
    runs-on: ubuntu-latest
    # NOTE: no job-level timeout-minutes here. A job that exceeds its timeout
    # is cancelled, and a cancelled job cancels the whole run even with
    # continue-on-error (continue-on-error only absorbs step failures).
    # The suite budget is enforced inside the step with the shell `timeout`
    # command instead: when it fires, the step fails, continue-on-error keeps
    # the run green, and the failure-report steps still run.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle (caches dependencies)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Prepare project (CI applicationId, Firebase config, midi packages)
        run: |
          sed -i 's/applicationId "org.DanVexTeam.NewCatroid"/applicationId "org.DanVexTeam.NewCatroid.ci"/g' catroid/build.gradle
          find . -name "google-services*.json" -exec sed -i 's/"org.DanVexTeam.NewCatroid"/"org.DanVexTeam.NewCatroid.ci"/g' {} +
          find catroid/src -type f -name "*.java" -exec sed -i 's/com.pdrogfer.mididroid/com.leff.midi/g' {} +
          find catroid/src -type f -name "*.java" -exec sed -i 's/com.oliewa92.mididroid/com.leff.midi/g' {} +
          echo "Project prepared for CI"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run full unit test suite (110m budget; failure is informational)
        run: |
          set -o pipefail
          timeout 110m ./gradlew :catroid:testDanvexDebugUnitTest --build-cache --parallel --stacktrace 2>&1 | tee "${RUNNER_TEMP}/full-test-output.log"

      - name: Extract test failure details
        if: failure()
        run: |
          OUT="${RUNNER_TEMP}/failures.txt"
          : > "$OUT"
          for f in catroid/build/test-results/testDanvexDebugUnitTest/*.xml; do
            [ -e "$f" ] || continue
            python3 - "$f" >> "$OUT" <<'PY'
          import sys, xml.etree.ElementTree as ET
          try:
              tree = ET.parse(sys.argv[1])
          except Exception:
              sys.exit(0)
          for tc in tree.getroot().iter('testcase'):
              for fail in list(tc.iter('failure')) + list(tc.iter('error')):
                  print("FAILED: %s.%s" % (tc.get('classname'), tc.get('name')))
                  print("  message: %s" % (fail.get('message') or '')[:400])
                  text = (fail.text or '').strip()
                  print("  stack: %s" % text[:1500])
                  print()
          PY
          done
          echo "extracted $(wc -l < "$OUT") lines of failure details"

      - name: Report failure details as a commit comment (optional)
        if: failure() && github.ref == 'refs/heads/arena/5736be66-newcatroid'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE="${RUNNER_TEMP}/failure.md"
          {
            echo "## :warning: Full unit test suite failure (informational) - run ${{ github.run_number }} @ ${{ github.sha }}"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ -f "${RUNNER_TEMP}/failures.txt" ]; then
              echo "### Failed test cases"
              echo '```'
              head -n 300 "${RUNNER_TEMP}/failures.txt"
              echo '```'
            fi
            if [ -f "${RUNNER_TEMP}/full-test-output.log" ]; then
              echo "### Output (errors first, then tail)"
              echo '```'
              grep -E "^e: |error:|FAILED|Execution failed|What went wrong|tests? (completed|failed)|There were failing tests" "${RUNNER_TEMP}/full-test-output.log" | head -n 100
              echo "----- tail -----"
              tail -n 60 "${RUNNER_TEMP}/full-test-output.log"
              echo '```'
            fi
          } > "$BODY_FILE"
          python3 - "$BODY_FILE" <<'PY'
          import json, os, sys, urllib.request
          body = open(sys.argv[1]).read()
          req = urllib.request.Request(
              "https://api.github.com/repos/%s/commits/%s/comments" % (os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"]),
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": "token " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json"},
              method="POST")
          with urllib.request.urlopen(req) as resp:
              print("Posted failure details as a commit comment (HTTP %s)" % resp.status)
          PY

      - name: Upload test reports, results and logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NewCatroid-full-test-reports-run${{ github.run_number }}-${{ github.sha }}
          path: |
            catroid/build/test-results/testDanvexDebugUnitTest/*.xml
            catroid/build/reports/tests/testDanvexDebugUnitTest/**
            ${{ runner.temp }}/full-test-output.log
          retention-days: 30
          if-no-files-found: warn
