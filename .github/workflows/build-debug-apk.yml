name: Build Debug APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Unit tests + debug APK (danvex)
    runs-on: ubuntu-latest

    env:
      _JAVA_OPTIONS: "-Xmx5g"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.workers.max=4 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle (caches dependencies)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Prepare project (CI applicationId, Firebase config, midi packages)
        run: |
          sed -i 's/applicationId "org.DanVexTeam.NewCatroid"/applicationId "org.DanVexTeam.NewCatroid.ci"/g' catroid/build.gradle
          find . -name "google-services*.json" -exec sed -i 's/"org.DanVexTeam.NewCatroid"/"org.DanVexTeam.NewCatroid.ci"/g' {} +
          find catroid/src -type f -name "*.java" -exec sed -i 's/com.pdrogfer.mididroid/com.leff.midi/g' {} +
          find catroid/src -type f -name "*.java" -exec sed -i 's/com.oliewa92.mididroid/com.leff.midi/g' {} +
          echo "Project prepared for CI"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests (danvex debug)
        run: ./gradlew :catroid:testDanvexDebugUnitTest --build-cache --parallel --stacktrace

      - name: Build debug APK (danvex)
        run: ./gradlew assembleDanvexDebug --build-cache --parallel -x lint -x test --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NewCatroid-debug-apk-run${{ github.run_number }}-${{ github.sha }}
          path: 'catroid/build/outputs/apk/danvex/debug/*.apk'
          retention-days: 30

      - name: Upload test reports and results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NewCatroid-test-reports-run${{ github.run_number }}-${{ github.sha }}
          path: |
            catroid/build/test-results/testDanvexDebugUnitTest/*.xml
            catroid/build/reports/tests/testDanvexDebugUnitTest/**
          retention-days: 30
