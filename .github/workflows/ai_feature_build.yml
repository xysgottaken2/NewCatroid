name: AI Feature Build (Test APK)

on:
  workflow_dispatch:
    inputs:
      feature_name:
        description: 'Feature name'
        required: true
        default: 'AI-Feature'

jobs:
  build:
    name: Build AI APK
    runs-on: ubuntu-latest

    env:
      _JAVA_OPTIONS: "-Xmx5g"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.workers.max=4 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

    steps:
      - name: Скачиваем код (Checkout)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Настраиваем Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Настраиваем Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Настраиваем проект (applicationId, Firebase)
        run: |
          sed -i 's/applicationId "org.DanVexTeam.NewCatroid"/applicationId "org.DanVexTeam.NewCatroid.aitest"/g' catroid/build.gradle
          find . -name "google-services*.json" -exec sed -i 's/"org.DanVexTeam.NewCatroid"/"org.DanVexTeam.NewCatroid.aitest"/g' {} +
          find catroid/src -type f -name "*.java" -exec sed -i 's/com.pdrogfer.mididroid/com.leff.midi/g' {} +
          find catroid/src -type f -name "*.java" -exec sed -i 's/com.oliewa92.mididroid/com.leff.midi/g' {} +
          echo "Пакет и зависимости настроены"

      - name: Даем права на исполнение Gradle
        run: chmod +x ./gradlew

      - name: Собираем нативный пробник pcrt_probe (best effort)
        continue-on-error: true
        run: |
          # The NDK ships with ubuntu-latest; the script also searches
          # $ANDROID_NDK_HOME, $ANDROID_HOME/ndk/* and $ANDROID_SDK_ROOT/ndk/*.
          bash tools/build_pcrt_probe.sh

      - name: Отмечаем, попал ли пробник в assets
        run: |
          if [ -f catroid/src/main/assets/pcruntime/arm64-v8a/pcrt_probe ]; then
            ls -l catroid/src/main/assets/pcruntime/*/
            echo "pcrt_probe будет упакован в APK"
          else
            echo "pcrt_probe НЕ собран: блок проверки рантайма честно сообщит MISSING_COMPONENT"
          fi

      - name: Компилируем APK (Danvex Debug)
        run: ./gradlew assembleDanvexDebug --build-cache --parallel -x lint -x test --stacktrace

      - name: Загружаем готовый APK в Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NewCatroid-${{ github.event.inputs.feature_name }}
          path: '**/build/outputs/apk/danvex/debug/*.apk'
          retention-days: 7
