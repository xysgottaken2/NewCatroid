name: PC compile diagnostic (temporary)

# Temporary workflow: compiles the Kotlin/Java sources of the app and reports the
# compiler output as a commit comment + annotations, because the regular build
# logs are not reachable from this environment. Delete this file when the PC
# layer compiles.

on:
  push:
    branches:
      - arena/53445679-newcatroid

permissions:
  contents: write

env:
  _JAVA_OPTIONS: "-Xmx5g"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.workers.max=4 -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  compile:
    name: Compile Kotlin and Java
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle (caches dependencies)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Prepare project (CI applicationId, Firebase config, midi packages)
        run: |
          sed -i 's/applicationId "org.DanVexTeam.NewCatroid"/applicationId "org.DanVexTeam.NewCatroid.ci"/g' catroid/build.gradle
          find . -name "google-services*.json" -exec sed -i 's/"org.DanVexTeam.NewCatroid"/"org.DanVexTeam.NewCatroid.ci"/g' {} +
          find catroid/src -type f -name "*.java" -exec sed -i 's/com.pdrogfer.mididroid/com.leff.midi/g' {} +
          find catroid/src -type f -name "*.java" -exec sed -i 's/com.oliewa92.mididroid/com.leff.midi/g' {} +
          echo "Project prepared for CI"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile (kotlin + java, no lint, no tests)
        run: |
          set -o pipefail
          ./gradlew assembleDanvexDebug -x lint -x test --stacktrace 2>&1 | tee "${RUNNER_TEMP}/compile.log"

      - name: Publish compiler errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUNNER_TEMP_DIR="${RUNNER_TEMP}"
          python3 - "$RUNNER_TEMP_DIR/compile.log" <<'PY'
          import json, os, sys, urllib.parse, urllib.request

          log_path = sys.argv[1]
          text = open(log_path, errors="replace").read()
          lines = text.splitlines()
          picked = []
          for line in lines:
              if line.startswith("e: ") or line.startswith("w: file") and False:
                  picked.append(line)
              elif "error:" in line and ("PC" in line or ".kt" in line or ".java" in line):
                  picked.append(line)
              elif line.startswith("> Task ") and "FAILED" in line:
                  picked.append(line)
          if not picked:
              grabbed = False
              for line in lines:
                  if "What went wrong" in line:
                      grabbed = True
                  if grabbed:
                      picked.append(line)
                  if len(picked) > 120:
                      break
          body = "\n".join(picked[:220]) or text[-8000:]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          payload = {"body": "### PC compile diagnostic\n\n```\n" + body[:60000] + "\n```"}
          request = urllib.request.Request(
              "https://api.github.com/repos/%s/commits/%s/comments" % (repo, sha),
              data=json.dumps(payload).encode(),
              headers={"Authorization": "token " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json"},
              method="POST")
          with urllib.request.urlopen(request) as response:
              print("Posted compiler output as a commit comment (HTTP %s)" % response.status)

          escaped = urllib.parse.quote(body[:60000], safe="")
          print("::error file=catroid/src/main/java/org/catrobat/catroid/pcgame/PcLaunch.kt,line=1::" + escaped[:60000])
          PY
